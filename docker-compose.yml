services:
  postgres:
    image: postgres:16-alpine
    container_name: nawaloka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nawaloka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nawaloka_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-nawaloka}
      CHATBOT_RO_PASSWORD: ${CHATBOT_RO_PASSWORD:-chatbot_ro_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nawaloka} -d ${POSTGRES_DB:-nawaloka}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: nawaloka-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile.scraper
    container_name: nawaloka-scraper
    env_file:
      - .env
    volumes:
      - ./backend/data/raw:/app/data/raw
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: nawaloka-backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      scraper:
        condition: service_completed_successfully
    volumes:
      - ./backend/data/raw:/app/data/raw:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nawaloka}:${POSTGRES_PASSWORD:-nawaloka_dev_pw}@postgres:5432/${POSTGRES_DB:-nawaloka}
      DATABASE_RO_URL: postgresql://chatbot_ro:${CHATBOT_RO_PASSWORD:-chatbot_ro_dev_pw}@postgres:5432/${POSTGRES_DB:-nawaloka}
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-groq,gemini,openrouter}
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8001}
    container_name: nawaloka-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
