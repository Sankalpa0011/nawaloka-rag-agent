[pytest]
testpaths = tests evals
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
markers =
    db: requires the Postgres container (docker compose up -d)
    qdrant: requires the Qdrant container
    llm: makes a real LLM API call
